services:
  db:
    image: postgres:16-alpine

    restart: unless-stopped

    environment:
      POSTGRES_USER: heimdall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: heimdall_db

    volumes:
      - pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heimdall -d heimdall_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${APP_IMAGE}

    restart: unless-stopped

    env_file:
      - .env.production

    environment:
      NODE_ENV: production

    ports:
      - "${PORT}:3000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  pg_data: